version: '3.8'

services:
  app:
    build:
      context: .              # Dockerfile 现在在根目录
      dockerfile: Dockerfile  # 可省略，默认就是这个名字
    image: likanug515/anitrack      # ⬅️ 指定构建后的镜像名和版本
    container_name: AniTrack
    working_dir: /app
    command: python main.py
    volumes:
      - .:/app  # ⬅️ 挂载当前目录到容器的 /app 目录
    environment:
      - PYTHONUNBUFFERED=1