name: Watch-Daily-Update

on:
  schedule:
    - cron: '0 8-11,20-23 * * *'  # 每天在 08:00、09:00、10:00、11:00 以及 20:00、21:00、22:00、23:00（UTC）运行
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'picture'

jobs:
  update-nodes:
    name: Update Daily Watch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cartoon collector
        run: python main.py
        timeout-minutes: 150
        env:
          MAX_CONCURRENT_TESTS: 50  # 自定义并发数

      - name: Commit changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 生成智能提交信息
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          commit_hash=$(git rev-parse --short HEAD)
          commit_msg="🌐 Update nodes - ${timestamp} (${commit_hash})"
          
          git add -A  # 添加所有变更文件
          
          if ! git diff-index --cached --quiet HEAD; then
            git commit -m "$commit_msg"
            git pull --rebase  # 防止冲突
            branch_name=${GITHUB_REF#refs/heads/}
            git push origin HEAD:$branch_name
            echo "::notice::Changes pushed successfully"
          else
            echo "::notice::No changes to commit"
          fi

      - name: Cleanup workspace
        if: always()
        run: |
          # 清理临时文件
          find . -type f -name '*.tmp' -delete
          rm -rf ./temp
