name: Release and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 匹配 v1.0.0 格式的标签
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  # 使用 Docker Hub 而不是 GHCR
  REGISTRY: docker.io
  # 设置您的 Docker Hub 用户名
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # 替换为您的真实用户名
  IMAGE_NAME: anitracker  # 只需要镜像名称，不需要仓库路径

jobs:
  releaser:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.extract-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: Set version tag
        id: extract-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # 基本版本格式验证
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $TAG. Use vX.Y.Z"
            exit 1
          fi
          
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configuration: |
            categories:
              - title: '✨ Features'
                labels: ['feature']
              - title: '🐛 Bug Fixes'
                labels: ['bug', 'fix']
              - title: '♻️ Refactors'
                labels: ['refactor']
              - title: '📚 Documentation'
                labels: ['docs']

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: releaser
    env:
      VERSION_TAG: ${{ needs.releaser.outputs.version_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  # 需要设置此 secret

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Release with image info
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ toJSON(github.event.release.id) }},
              body: `${{ github.event.release.body }}\n\n## Docker Image\n\n` +
                     `- **${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}**\n` +
                     `- Pull with: \`docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}\``
            })