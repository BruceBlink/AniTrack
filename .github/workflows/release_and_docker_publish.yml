name: Release and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 匹配 v1.0.0 格式的标签
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  # 使用 Docker Hub 而不是 GHCR
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub 用户名
  IMAGE_NAME: anitracker  # 镜像名称

jobs:
  releaser:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.extract-version.outputs.version }}
      release_id: ${{ steps.release-id.outputs.release_id }}  # 输出 Release ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史（包含标签）

      - name: Set version tag
        id: extract-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          # 基本版本格式验证
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $TAG. Use vX.Y.Z"
            exit 1
          fi
          
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

      - name: Get previous tag
        id: get-prev-tag
        run: |
          # 获取所有标签（按版本降序排序）
          git fetch --tags --force  # 确保获取所有远程标签
          TAGS=$(git tag --list 'v*' --sort=-v:refname)
          echo "All tags: $TAGS"
          
          CURRENT_TAG="${{ env.VERSION_TAG }}"
          PREV_TAG=""
          
          # 遍历标签列表找到上一个标签
          while IFS= read -r tag; do
            if [[ "$tag" == "$CURRENT_TAG" ]]; then
              if [[ -n "$PREV_TAG" ]]; then
                echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
                echo "Found previous tag: $PREV_TAG"
                break
              else
                # 如果是第一个标签，没有上一个标签
                echo "prev_tag=" >> $GITHUB_OUTPUT
                echo "No previous tag found (first release)"
                break
              fi
            fi
            PREV_TAG="$tag"
          done <<< "$TAGS"
          
          # 如果没有找到上一个标签（首次发布）
          if [[ -z "$PREV_TAG" ]]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "No previous tag found (first release)"
          fi

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 使用正确的参数名
          fromTag: ${{ steps.get-prev-tag.outputs.prev_tag || '' }}  # 从上个标签开始
          toTag: ${{ env.VERSION_TAG }}  # 到当前标签
          failOnError: false  # 即使没有PR也不失败
          configuration: |
            categories:
              - title: '✨ Features'
                labels: ['feature']
              - title: '🐛 Bug Fixes'
                labels: ['bug', 'fix']
              - title: '♻️ Refactors'
                labels: ['refactor']
              - title: '📚 Documentation'
                labels: ['docs']
              - title: '📦 Other Changes'
                labels: ['*']  # 捕获所有未分类的PR

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          body: ${{ steps.changelog.outputs.changelog || 'Initial release' }}  # 处理空changelog
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}

      - name: Capture Release ID
        id: release-id
        run: |
          RELEASE_ID="${{ steps.create-release.outputs.id }}"
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "Captured Release ID: $RELEASE_ID"

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: releaser
    env:
      VERSION_TAG: ${{ needs.releaser.outputs.version_tag }}
      RELEASE_ID: ${{ needs.releaser.outputs.release_id }}  # 从releaser传递的Release ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Convert image name to lowercase
        id: lowercase-image
        run: |
          # 手动转换为小写
          LOWER_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_IMAGE_NAME=$LOWER_NAME" >> $GITHUB_ENV
          echo "Converted image name to lowercase: $LOWER_NAME"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.LOWER_IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.LOWER_IMAGE_NAME }}:latest
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Release with image info
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            try {
              // 获取从releaser作业传递的Release ID
              const releaseId = process.env.RELEASE_ID;
              console.log(`Updating release with ID: ${releaseId}`);
            
              // 获取当前的Release内容
              const currentRelease = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              });
            
              // 添加Docker镜像信息
              const dockerInfo = 
                `\n\n## Docker Image\n\n` +
                `- **${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}**\n` +
                `- Pull with: \`docker pull ${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}\``;
            
              const updatedBody = currentRelease.data.body + dockerInfo;
            
              // 更新Release
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                body: updatedBody
              });
            
              console.log('Release updated successfully');
            } catch (error) {
              console.error('Failed to update release:', error);
              // 优雅处理错误，不使工作流失败
            }