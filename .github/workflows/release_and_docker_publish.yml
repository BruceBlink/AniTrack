name: Release and Publish

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: anitracker

jobs:
  releaser:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: extract-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup Go (optional)
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Setup Python (optional)
        if: ${{ hashFiles('**/*.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: GoReleaser (if Go project)
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Python Release Package (if Python project)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: releaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=match,pattern=^(.*-beta.*)$,group=1,enable=${{ contains(github.ref_name, 'beta') }}
            type=match,pattern=^v(.*)$,group=1,enable=${{ !contains(github.ref_name, 'beta') }}
          flavor: |
            latest=${{ !contains(github.ref_name, 'beta') }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Multi-platform Docker image for ${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update GitHub Release with Docker info
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const tag = process.env.VERSION_TAG;
              const dockerInfo = `\n\n## Docker Image\n\n` +
                `- **Docker Hub**: \`${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${tag}\`\n` +
                `- **GHCR**: \`ghcr.io/${{ github.repository }}:${tag}\``;
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const release = releases.data.find(r => r.tag_name === tag);
              if (release) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  body: release.body + dockerInfo
                });
              }
            } catch (e) {
              console.error('Failed to update release:', e);
            }
