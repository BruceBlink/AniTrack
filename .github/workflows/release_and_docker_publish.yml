name: Release and Publish

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub 用户名
  IMAGE_NAME: anitracker  # 镜像名称

jobs:
  releaser:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.extract-version.outputs.version }}
      release_id: ${{ steps.capture-release-id.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: extract-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $TAG. Use vX.Y.Z"
            exit 1
          fi

          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Setup Go (optional)
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: actions/setup-go@v4
        with:
          go-version: stable

      - name: Setup Python (optional)
        if: ${{ hashFiles('**/*.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: GoReleaser (if Go project)
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Create Python Release Package (if Python project)
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Get previous tag
        id: get-prev-tag
        run: |
          git fetch --tags --force
          # 升序排列的tag列表
          TAGS=$(git tag --list 'v*' --sort=v:refname)
          CURRENT_TAG="${{ env.VERSION_TAG }}"
          # 如果当前标签是最新的，则获取上一个标签(git自带的命令)
          PREV_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          PREV=${{ steps.get-prev-tag.outputs.prev_tag }}
          if [ -z "$PREV" ]; then
            echo "首次发布，跳过 Changelog 生成"
            echo "changelog=" >> $GITHUB_OUTPUT
          else
            RANGE="$PREV..${{ env.VERSION_TAG }}"
            echo "Changelog 范围: $RANGE"
            CHANGELOG=$(git log $RANGE --pretty=format:"%h %s")
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          body: ${{ steps.changelog.outputs.changelog || 'Initial release' }}
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture Release ID
        id: capture-release-id
        run: |
          echo "release_id=${{ steps.create-release.outputs.id }}" >> $GITHUB_OUTPUT

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: releaser
    env:
      VERSION_TAG: ${{ needs.releaser.outputs.version_tag }}
      RELEASE_ID: ${{ needs.releaser.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=match,pattern=^(.*-beta.*)$,group=1,enable=${{ contains(github.ref_name, 'beta') }}
            type=match,pattern=^v(.*)$,group=1,enable=${{ !contains(github.ref_name, 'beta') }}
          flavor: |
            latest=${{ !contains(github.ref_name, 'beta') }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Multi-platform Docker image for ${{ github.event.repository.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Convert image name to lowercase
        id: lowercase-image
        run: |
          LOWER_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_IMAGE_NAME=$LOWER_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Release with docker image info
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const releaseId = process.env.RELEASE_ID;
              const current = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              });
              const info = 
                `\n\n## Docker Image\n\n` +
                `- **${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}**\n` +
                `- Pull with: \`docker pull ${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}\``;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                body: current.data.body + info
              });
            } catch (e) {
              console.error('Update release failed:', e);
            }
