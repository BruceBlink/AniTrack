name: Release and Push Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # 匹配 v1.0.0 格式的标签
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true

permissions:
  contents: write
  packages: write

env:
  # 使用 Docker Hub 而不是 GHCR
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub 用户名
  IMAGE_NAME: anitracker  # 镜像名称

jobs:
  releaser:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.extract-version.outputs.version }}
      release_id: ${{ steps.capture-release-id.outputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version tag
        id: extract-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $TAG. Use vX.Y.Z"
            exit 1
          fi

          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV

      - name: Get previous tag
        id: get-prev-tag
        run: |
          git fetch --tags --force
          TAGS=$(git tag --list 'v*' --sort=-v:refname)
          CURRENT_TAG="${{ env.VERSION_TAG }}"
          PREV_TAG=""
          while IFS= read -r tag; do
            if [[ "$tag" == "$CURRENT_TAG" ]]; then
              break
            fi
            PREV_TAG="$tag"
          done <<< "$TAGS"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -z "${{ steps.get-prev-tag.outputs.prev_tag }}" ]; then
            RANGE="${{ env.VERSION_TAG }}"
          else
            RANGE="${{ steps.get-prev-tag.outputs.prev_tag }}..${{ env.VERSION_TAG }}"
          fi
          echo "Changelog 范围: $RANGE"

          # 每行：短 SHA + 空格 + 提交信息
          CHANGELOG=$(git log $RANGE --pretty=format:"%h %s")

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.IMAGE_NAME }}-${{ env.VERSION_TAG }}
          body: ${{ steps.changelog.outputs.changelog || 'Initial release' }}
          prerelease: ${{ contains(env.VERSION_TAG, '-') }}

      - name: Capture Release ID
        id: capture-release-id
        run: |
          echo "release_id=${{ steps.create-release.outputs.id }}" >> $GITHUB_OUTPUT

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: releaser
    env:
      VERSION_TAG: ${{ needs.releaser.outputs.version_tag }}
      RELEASE_ID: ${{ needs.releaser.outputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Convert image name to lowercase
        id: lowercase-image
        run: |
          LOWER_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_IMAGE_NAME=$LOWER_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.LOWER_IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.LOWER_IMAGE_NAME }}:latest
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Release with image info
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const releaseId = process.env.RELEASE_ID;
              const current = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId
              });
              const info = 
                `\n\n## Docker Image\n\n` +
                `- **${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}**\n` +
                `- Pull with: \`docker pull ${process.env.DOCKERHUB_USERNAME}/${process.env.LOWER_IMAGE_NAME}:${process.env.VERSION_TAG}\``;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                body: current.data.body + info
              });
            } catch (e) {
              console.error('Update release failed:', e);
            }
