[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anitracker"
version = "2.1.4"
description = "AniTracker - an anime crawler project, supporting mikanani, tencent, bilibili, youku, iqiyi..."
authors = [
    { name="likanug", email="likanug.g@qq.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.4",
    "beautifulsoup4>=4.13.4",
    "brotlicffi>=1.0.9",
    "colorlog>=6.7.0",
    "aiohttp >=3.10.5",
    "chardet >=5.2.0",
    "zstandard>=0.23.0",
    "brotli>=1.1.0",

]

[project.scripts]
anitracker = "anitracker.__main__:main"

[tool.setuptools]
packages = ["anitracker", "common", "config", "platforms", "utils"]
